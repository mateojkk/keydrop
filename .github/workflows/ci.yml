name: Verify Keydrop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/verify-global-code.mjs
      - run: npm run build
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - run: cargo test
      - run: cargo build --target wasm32-unknown-unknown --release
      - run: cargo test
        working-directory: factory
      - run: cargo build --target wasm32-unknown-unknown --release
        working-directory: factory
      - uses: actions/upload-artifact@v4
        with:
          name: keydrop-v2-contracts
          path: |
            contract/target/wasm32-unknown-unknown/release/keydrop.wasm
            factory/target/wasm32-unknown-unknown/release/keydrop_factory.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: keydrop-cargo-lock
          path: |
            contract/Cargo.lock
            factory/Cargo.lock
